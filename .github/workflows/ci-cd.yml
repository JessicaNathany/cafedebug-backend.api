name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props', '**/Directory.Build.targets', '**/packages.lock.json', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore and audit dependencies
        run: >-
          dotnet restore cafedebug-backend.api.sln
          -p:NuGetAudit=true -p:NuGetAuditMode=all
          -warnaserror:NU1900,NU1903,NU1904

      - name: Build solution
        run: dotnet build cafedebug-backend.api.sln --no-restore --configuration Release

      - name: Run tests with coverage
        run: >-
          dotnet test tests/cafedebug.backend.api.test/cafedebug.backend.api.test.csproj
          --no-build --no-restore --configuration Release --verbosity normal
          --results-directory TestResults
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Publish test and coverage summary
        if: ${{ !cancelled() }}
        run: |
          python3 <<'PYTHON'
          import os
          import xml.etree.ElementTree as ET
          from collections import Counter
          from pathlib import Path

          results = Path("TestResults")
          errors = []
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Test Results\n\n")
              reports = sorted(results.glob("**/*.trx"))
              if not reports:
                  errors.append("No TRX test results were produced. Check the restore, build, and test logs.")
              else:
                  try:
                      outcomes = Counter(
                          result.get("outcome", "Unknown")
                          for report in reports
                          for result in ET.parse(report).getroot().findall(".//{*}UnitTestResult")
                      )
                      passed = outcomes["Passed"]
                      skipped = outcomes["NotExecuted"]
                      failed = sum(outcomes.values()) - passed - skipped
                      summary.write("| Passed | Failed | Skipped |\n| ---: | ---: | ---: |\n")
                      summary.write(f"| {passed} | {failed} | {skipped} |\n")
                      if not outcomes:
                          errors.append("TRX reports contained no test results.")
                      if failed:
                          errors.append(f"{failed} test result(s) failed.")
                  except (ET.ParseError, OSError):
                      errors.append("Unable to read TRX test results.")

              summary.write("\n## Coverage\n\n")
              coverage_reports = sorted(results.glob("*/coverage.cobertura.xml"))
              if not coverage_reports:
                  errors.append("No Cobertura coverage results were produced.")
              else:
                  try:
                      roots = [ET.parse(report).getroot() for report in coverage_reports]
                      summary.write("| Metric | Covered | Total | Coverage |\n| --- | ---: | ---: | ---: |\n")
                      for metric in ("lines", "branches"):
                          covered = sum(int(root.attrib[f"{metric}-covered"]) for root in roots)
                          total = sum(int(root.attrib[f"{metric}-valid"]) for root in roots)
                          percentage = f"{covered / total:.2%}" if total else "N/A"
                          summary.write(f"| {metric.title()} | {covered} | {total} | {percentage} |\n")
                  except (ET.ParseError, OSError, KeyError, ValueError):
                      errors.append("Unable to read Cobertura coverage results.")

              for error in errors:
                  summary.write(f"\n**Report error:** {error}\n")
          if errors:
              raise SystemExit("; ".join(errors))
          PYTHON

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: error

      - name: Upload coverage results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results
          path: TestResults/*/coverage.cobertura.xml
          if-no-files-found: error
